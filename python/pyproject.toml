[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arious-meet-mcp"
version = "0.3.0"
description = "Typed Python client for the Arious Meet MCP server (sync and async)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.25"]
keywords = ["mcp", "arious", "agents", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://api.ariousmeet.com/connect"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arious_meet_mcp = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045", "UP032", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501"]
"tests/*" = ["E501"]
"src/arious_meet_mcp/_generated.py" = ["E501", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real server (needs ARIOUS_MCP_TOKEN)"]
addopts = "-m 'not live'"
